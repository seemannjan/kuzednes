<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kůže dnes</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <header class="header">
        <div>
            <h1>Kůže dnes</h1>
            <p>Poznej svou kůži.</p>
        </div>
    </header>

    <nav class="navigation">
        <button class="nav-button active" data-page="new-entry">
            Dnešní záznam
        </button>

        <button class="nav-button" data-page="history">
            Historie
        </button>
    </nav>


    <!-- NOVÝ ZÁZNAM -->
    <main id="new-entry" class="page active">

        <section class="card">
            <h2>Dnešní stav kůže</h2>
            <p class="subtitle">
                Jak se dnes tvoje kůže cítí?
            </p>

            <div class="field">
                <label>Intenzita ekzému</label>

                <div class="scale" id="severityScale">
                    <button type="button" data-value="1">1</button>
                    <button type="button" data-value="2">2</button>
                    <button type="button" data-value="3">3</button>
                    <button type="button" data-value="4">4</button>
                    <button type="button" data-value="5">5</button>
                    <button type="button" data-value="6">6</button>
                    <button type="button" data-value="7">7</button>
                    <button type="button" data-value="8">8</button>
                    <button type="button" data-value="9">9</button>
                    <button type="button" data-value="10">10</button>
                </div>

                <div class="scale-labels">
                    <span>Skoro nic</span>
                    <span>Velmi silné</span>
                </div>
            </div>


            <div class="field">
                <label>Jak moc to svědí?</label>

                <div class="scale" id="itchScale">
                    <button type="button" data-value="1">1</button>
                    <button type="button" data-value="2">2</button>
                    <button type="button" data-value="3">3</button>
                    <button type="button" data-value="4">4</button>
                    <button type="button" data-value="5">5</button>
                    <button type="button" data-value="6">6</button>
                    <button type="button" data-value="7">7</button>
                    <button type="button" data-value="8">8</button>
                    <button type="button" data-value="9">9</button>
                    <button type="button" data-value="10">10</button>
                </div>

                <div class="scale-labels">
                    <span>Vůbec</span>
                    <span>Nejhorší</span>
                </div>
            </div>
        </section>


        <section class="card">
            <h2>Kde se ekzém objevil?</h2>

            <div class="checkbox-grid">
                <label class="checkbox">
                    <input type="checkbox" value="Obličej" name="location">
                    <span>Obličej</span>
                </label>

                <label class="checkbox">
                    <input type="checkbox" value="Ruce" name="location">
                    <span>Ruce</span>
                </label>

                <label class="checkbox">
                    <input type="checkbox" value="Lokty" name="location">
                    <span>Lokty</span>
                </label>

                <label class="checkbox">
                    <input type="checkbox" value="Kolena" name="location">
                    <span>Kolena</span>
                </label>

                <label class="checkbox">
                    <input type="checkbox" value="Trup" name="location">
                    <span>Trup</span>
                </label>

                <label class="checkbox">
                    <input type="checkbox" value="Jinde" name="location">
                    <span>Jinde</span>
                </label>
            </div>
        </section>


        <section class="card">
            <h2>Co mohlo mít vliv?</h2>

            <div class="checkbox-grid">
                <label class="checkbox">
                    <input type="checkbox" value="Stres" name="trigger">
                    <span>Stres</span>
                </label>

                <label class="checkbox">
                    <input type="checkbox" value="Špatný spánek" name="trigger">
                    <span>Špatný spánek</span>
                </label>

                <label class="checkbox">
                    <input type="checkbox" value="Pocení" name="trigger">
                    <span>Pocení</span>
                </label>

                <label class="checkbox">
                    <input type="checkbox" value="Sport" name="trigger">
                    <span>Sport</span>
                </label>

                <label class="checkbox">
                    <input type="checkbox" value="Počasí" name="trigger">
                    <span>Počasí</span>
                </label>

                <label class="checkbox">
                    <input type="checkbox" value="Nový produkt" name="trigger">
                    <span>Nový produkt</span>
                </label>

                <label class="checkbox">
                    <input type="checkbox" value="Jídlo" name="trigger">
                    <span>Jídlo</span>
                </label>

                <label class="checkbox">
                    <input type="checkbox" value="Nic zvláštního" name="trigger">
                    <span>Nic zvláštního</span>
                </label>

                <label class="checkbox">
                    <input type="checkbox" value="Jiné" name="trigger">
                    <span>Jiné</span>
                </label>
            </div>
        </section>


        <section class="card">

            <div class="field">
                <label for="products">Použité produkty</label>

                <textarea
                    id="products"
                    placeholder="Např. Lipikar Baume AP+, kortikoidní mast..."
                ></textarea>
            </div>


            <div class="field">
                <label for="note">Poznámka</label>

                <textarea
                    id="note"
                    placeholder="Jak ses dnes cítil/a? Co se změnilo?"
                ></textarea>
            </div>

        </section>


        <button id="saveButton" class="save-button">
            Uložit dnešní záznam
        </button>

        <div id="successMessage" class="success-message">
            Záznam byl uložen ✓
        </div>

    </main>


    <!-- HISTORIE -->
    <main id="history" class="page">

        <section class="history-header">
            <div>
                <h2>Moje historie</h2>
                <p class="subtitle">
                    Tvoje předchozí záznamy
                </p>
            </div>

            <span id="entryCount" class="entry-count">0 záznamů</span>
        </section>


        <div id="historyList" class="history-list">
            <!-- Záznamy se vloží pomocí JavaScriptu -->
        </div>

    </main>

</div>


<script src="script.js"></script>

</body>
</html>
